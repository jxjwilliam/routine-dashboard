<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Routine Dashboard · William</title>
<style>
  :root { --bg:#0f1420; --card:#1a2233; --line:#2a3650; --txt:#e8edf5; --dim:#93a1b8; --ok:#22c55e; --bad:#ef4444; --warn:#f59e0b; --accent:#5ea8ff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif; background:var(--bg); color:var(--txt); min-height:100vh; }
  header { padding:28px 20px 12px; text-align:center; }
  header h1 { font-size:24px; font-weight:700; letter-spacing:.5px; }
  header p { color:var(--dim); font-size:13px; margin-top:6px; }
  .tabs { display:flex; gap:8px; justify-content:center; padding:14px 16px; position:sticky; top:0; background:rgba(15,20,32,.92); backdrop-filter:blur(8px); z-index:10; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .tab { border:1px solid var(--line); background:var(--card); color:var(--txt); padding:9px 18px; border-radius:999px; font-size:14px; cursor:pointer; transition:.15s; }
  .tab:hover { border-color:var(--accent); }
  .tab.active { background:var(--accent); border-color:var(--accent); color:#0b1220; font-weight:600; }
  .toolbar { display:flex; gap:10px; align-items:center; justify-content:center; padding:14px 16px 4px; flex-wrap:wrap; }
  .toolbar select { background:var(--card); color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:8px 12px; font-size:14px; }
  .toolbar button { background:var(--card); color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:8px 14px; font-size:14px; cursor:pointer; }
  .toolbar button:hover { border-color:var(--accent); }
  .meta { text-align:center; color:var(--dim); font-size:12px; padding:6px 0 2px; }
  main { max-width:1180px; margin:0 auto; padding:12px 16px 60px; }
  .table-wrap { overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:14px; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; min-width:760px; }
  th { text-align:left; padding:12px 14px; color:var(--dim); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.4px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td { padding:11px 14px; border-bottom:1px solid var(--line); vertical-align:top; }
  tr:last-child td { border-bottom:none; }
  tr:hover td { background:rgba(94,168,255,.05); }
  td a { color:var(--accent); word-break:break-all; }
  .badge { display:inline-block; padding:3px 10px; border-radius:999px; font-size:12.5px; font-weight:600; white-space:nowrap; }
  .badge.ok { background:rgba(34,197,94,.15); color:var(--ok); }
  .badge.bad { background:rgba(239,68,68,.15); color:var(--bad); }
  .badge.warn { background:rgba(245,158,11,.15); color:var(--warn); }
  .empty, .error { text-align:center; padding:48px 20px; color:var(--dim); }
  .error { color:var(--bad); }
  .loading { text-align:center; padding:48px 20px; color:var(--dim); }
  footer { text-align:center; color:var(--dim); font-size:12px; padding:0 16px 40px; }
</style>
</head>
<body>
<header>
  <h1>📊 Routine Dashboard</h1>
  <p>定时任务与发布记录 · 数据每晚约 23:30 (PDT) 自动更新</p>
</header>
<nav class="tabs">
  <button class="tab active" data-view="routine">📋 Routine Report</button>
  <button class="tab" data-view="tiktok">🎵 TikTok 已发布</button>
  <button class="tab" data-view="xhs">📕 小红书已发布</button>
</nav>
<div class="toolbar">
  <select id="monthSel" style="display:none"></select>
  <button id="refreshBtn">↻ 刷新</button>
</div>
<div class="meta" id="metaLine"></div>
<main><div id="content"><div class="loading">加载中…</div></div></main>
<footer>Built for William · 数据来源 GitHub routine-dashboard 仓库</footer>

<script>
const CFG = { owner: 'jxjwilliam', repo: 'routine-dashboard', branch: 'main' };
const raw = p => `https://raw.githubusercontent.com/${CFG.owner}/${CFG.repo}/${CFG.branch}/${p}`;
const api = p => `https://api.github.com/repos/${CFG.owner}/${CFG.repo}/${p}`;
let currentView = 'routine';
let currentMonth = null;

const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const linkify = s => esc(s).replace(/(https?:\/\/[^\s<|]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
const bust = u => u + (u.includes('?') ? '&' : '?') + 't=' + Date.now();

async function fetchText(url) {
  const r = await fetch(bust(url));
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.text();
}

function parseMdTable(md) {
  const lines = md.split('\n');
  let hi = -1, title = '';
  for (const l of lines) { const m = l.match(/^#\s+(.*)/); if (m) { title = m[1].trim(); break; } }
  for (let i = 0; i < lines.length - 1; i++) {
    if (/^\s*\|.*\|\s*$/.test(lines[i]) && /^\s*\|[\s:\-|]+\|\s*$/.test(lines[i+1])) { hi = i; break; }
  }
  if (hi < 0) return { title, headers: [], rows: [] };
  const split = l => l.trim().replace(/^\||\|$/g, '').split('|').map(s => s.trim());
  const headers = split(lines[hi]);
  const rows = [];
  for (let i = hi + 2; i < lines.length; i++) {
    if (!/^\s*\|/.test(lines[i])) break;
    rows.push(split(lines[i]));
  }
  return { title, headers, rows };
}

function statusBadge(s) {
  if (/✅/.test(s)) return '<span class="badge ok">✅ succ</span>';
  if (/❌/.test(s)) return '<span class="badge bad">❌ fail</span>';
  if (/⚠️/.test(s)) return '<span class="badge warn">⚠️ partial</span>';
  return esc(s);
}

function renderTable({ title, headers, rows }) {
  if (!headers.length) return '<div class="empty">暂无数据</div>';
  const si = headers.findIndex(h => /status/i.test(h));
  let html = '<div class="table-wrap"><table><thead><tr>' +
    headers.map(h => `<th>${esc(h)}</th>`).join('') + '</tr></thead><tbody>';
  for (const r of rows) {
    html += '<tr>' + headers.map((h, i) => {
      const cell = r[i] || '';
      const body = (i === si) ? statusBadge(cell) : linkify(cell);
      return `<td>${body}</td>`;
    }).join('') + '</tr>';
  }
  return html + '</tbody></table></div>';
}

async function listMonths() {
  try {
    const items = await (await fetch(bust(api('contents/data')))).json();
    return items.filter(x => /^\d{4}-\d{2}-routine-report\.md$/.test(x.name))
                .map(x => x.name.replace('-routine-report.md', '')).sort().reverse();
  } catch (e) { return []; }
}

async function loadView() {
  const box = document.getElementById('content');
  const meta = document.getElementById('metaLine');
  const monthSel = document.getElementById('monthSel');
  box.innerHTML = '<div class="loading">加载中…</div>';
  try {
    let file, label;
    if (currentView === 'routine') {
      if (!currentMonth) {
        const months = await listMonths();
        currentMonth = months[0] || new Date().toISOString().slice(0, 7);
        monthSel.innerHTML = months.map(m => `<option ${m===currentMonth?'selected':''}>${m}</option>`).join('');
        monthSel.style.display = months.length ? '' : 'none';
      }
      file = `data/${currentMonth}-routine-report.md`; label = `Routine Report · ${currentMonth}`;
    } else if (currentView === 'tiktok') {
      file = 'data/tiktok-published.md'; label = 'TikTok 已发布';
    } else {
      file = 'data/xiaohongshu-published.md'; label = '小红书已发布';
    }
    monthSel.style.display = currentView === 'routine' ? '' : 'none';
    const md = await fetchText(raw(file));
    box.innerHTML = renderTable(parseMdTable(md));
    meta.textContent = `${label} · 更新于 ${new Date().toLocaleString('zh-CN', { hour12: false })}`;
  } catch (e) {
    box.innerHTML = `<div class="error">加载失败：${esc(e.message)}，请稍后重试</div>`;
  }
}

document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  currentView = t.dataset.view;
  loadView();
}));
document.getElementById('monthSel').addEventListener('change', e => { currentMonth = e.target.value; loadView(); });
document.getElementById('refreshBtn').addEventListener('click', loadView);
setInterval(loadView, 5 * 60 * 1000);
loadView();
</script>
</body>
</html>
